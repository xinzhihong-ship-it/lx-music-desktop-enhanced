<!doctype html>
<meta charset="utf-8">
<title>VST3 realtime regression check</title>
<script>
const { ipcRenderer } = require('electron')
;(async () => {
  const context = new AudioContext({ sampleRate: 48000 })
  await ipcRenderer.invoke('configure', context.sampleRate)
  await context.audioWorklet.addModule('../src/renderer/plugins/player/vst3-worklet.js')
  const node = new AudioWorkletNode(context, 'lx-vst3', { outputChannelCount: [2] })
  const source = new OscillatorNode(context, { frequency: 440 })
  // Exercise the complete realtime graph without making sound on the user's speakers.
  const mute = new GainNode(context, { gain: 0 })
  source.connect(node).connect(mute).connect(context.destination)
  let serial = Promise.resolve()
  let blocks = 0
  let maxRoundTripMs = 0
  let error = ''
  node.onprocessorerror = () => { error = 'AudioWorklet crashed' }
  node.port.onmessage = ({ data }) => {
    if (data.action === 'fault') { error = 'Realtime audio deadline missed'; return }
    if (data.action !== 'process') return
    const start = performance.now()
    serial = serial.then(async () => {
      const result = await ipcRenderer.invoke('process', data.inputs.map(channel => Array.from(channel)))
      if (result.outputs.length !== 2 || result.outputs.some(channel => channel.length !== 512 || channel.some(sample => !Number.isFinite(sample)))) throw new Error('Invalid native PCM output')
      maxRoundTripMs = Math.max(maxRoundTripMs, performance.now() - start)
      blocks++
      node.port.postMessage({ ...result, epoch: data.epoch, sequence: data.sequence })
    }).catch(failure => { error = failure.message })
  }
  node.port.postMessage({ action: 'reset', epoch: 1, active: true })
  source.start()
  await context.resume()
  await new Promise(resolve => setTimeout(resolve, 7000))
  await context.suspend()
  await serial
  await context.close()
  if (blocks < 500) error ||= 'Audio clock did not advance'
  ipcRenderer.send('result', { error, blocks, maxRoundTripMs, sampleRate: context.sampleRate })
})().catch(error => ipcRenderer.send('result', { error: error.message }))
</script>
