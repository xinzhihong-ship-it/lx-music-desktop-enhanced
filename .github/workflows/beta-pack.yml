name: Build Beta

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_CI: "true"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  CheckCode:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6
      - name: Setup Node Env
        uses: ./.github/actions/setup
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-cursor-dev libxkbcommon-dev
      - name: Lint source
        run: npm run lint
      - name: Build source
        run: npm run build
      - name: Run VST3 tests
        run: npm run test:vst3
      - name: Verify VST3 worklet asset
        shell: bash
        run: |
          test -n "$(find dist -type f -name '*.js' -print0 | xargs -0 grep -l 'lx-vst3' | head -n 1)"
          grep -R "audioWorklet.addModule" dist/renderer.js dist >/dev/null

  Vst3Audio:
    name: VST3 audio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6
      - name: Setup Node Env
        uses: ./.github/actions/setup
      - name: Build debug VST3 host
        run: cargo build --locked --manifest-path native/vst3-host/Cargo.toml
      - name: Run realtime audio test
        run: npm run test:vst3:audio

  # CheckCode:
  #   name: Lint Code
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out git repository
  #       uses: actions/checkout@v6

  #     - name: Install Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20

  #     - name: Cache file
