  #       with:
  #         path: |
  #           node_modules
  #           $HOME/.cache/electron
  #           $HOME/.cache/electron-builder
  #           $HOME/.npm/_prebuilds
  #         key: ${{ runner.os }}-build-caches-${{ hashFiles('**/package-lock.json') }}
  #         restore-keys: |
  #           ${{ runner.os }}-build-

  #     - name: Install Dependencies
  #       run: |
  #         npm ci

  #     - name: Lint src code
  #       run: npm run lint

  Windows:
    name: Windows
    runs-on: windows-latest
    needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        shell: pwsh
        run: |
          .\build-config\download-ffmpeg-windows.ps1 x64
          .\build-config\download-ffmpeg-windows.ps1 arm64

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build Package Setup x64
        run: npm run pack:win:setup:x64
      - name: Upload Artifact Setup x64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-x64-Setup
          path: build/*-x64-Setup.exe
          if-no-files-found: error

      - name: Build Package 7z x64
        run: npm run pack:win:7z:x64
      - name: Upload Artifact 7z x64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-win_x64-green
          path: build/*win_x64-green.7z
          if-no-files-found: error

      - name: Build Package Setup arm64
        run: npm run pack:win:setup:arm64
      - name: Upload Artifact Setup arm64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-arm64-Setup
          path: build/*-arm64-Setup.exe
          if-no-files-found: error

      - name: Build Package 7z arm64
        run: npm run pack:win:7z:arm64
      - name: Upload Artifact 7z arm64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-win_arm64-green
          path: build/*win_arm64-green.7z
          if-no-files-found: error

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

  Windows_7:
    name: Windows_7
    runs-on: windows-latest
    env:
      BUILD_WIN7: true
    needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        shell: pwsh
        run: |
          .\build-config\download-ffmpeg-windows.ps1 x64
          .\build-config\download-ffmpeg-windows.ps1 x86

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22
          pip.exe install setuptools

      - name: Verify Win7 package intentionally omits VST3 host
        shell: pwsh
        run: |
          if (Test-Path .\build\Release\lx-vst3-host.exe) { throw 'Win7 package must not reuse VST3 host' }
      - name: Build Package win7 Setup x64
        run: npm run pack:win7:setup:x64
      - name: Upload Artifact win7 Setup x64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-win7_x64-Setup
          path: build/*win7_x64-Setup.exe
          if-no-files-found: error

      - name: Build Package win7 7z x64
        run: npm run pack:win7:7z:x64
      - name: Upload Artifact win7 7z x64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-win7_x64-green
          path: build/*win7_x64-green.7z
          if-no-files-found: error

      - name: Build Package win7 7z x86
        run: npm run pack:win7:7z:x86
      - name: Upload Artifact win7 7z x86
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-win7_x86-green
          path: build/*win7_x86-green.7z
          if-no-files-found: error

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

  Mac:
    name: Mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            package: pack:mac:dmg
          - arch: arm64
            runner: macos-14
            package: pack:mac:dmg:arm64
    runs-on: ${{ matrix.runner }}
    needs: CheckCode
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Build verified FFmpeg
        run: bash build-config/build-ffmpeg-macos.sh ${{ matrix.arch }}

      - name: Install python setuptools
        run: brew install mpv python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> "$GITHUB_ENV"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build Package dmg
        run: npm run ${{ matrix.package }}

      - name: Upload Artifact dmg
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-mac-dmg-${{ matrix.arch }}
          path: |
            build/*.dmg
            build/*.dmg.blockmap
          if-no-files-found: error

      - name: Generate file MD5
        run: |
          cd build
          md5 ./*.dmg

  Linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: CheckCode
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools gcc-arm-linux-gnueabihf qemu-user-static libxcb1-dev

      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> "$GITHUB_ENV"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        run: |
          bash build-config/download-ffmpeg-linux.sh x64
          bash build-config/download-ffmpeg-linux.sh arm64
          bash build-config/build-ffmpeg-linux-armv7.sh

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build Package deb amd64
        run: npm run pack:linux:deb:amd64
      - name: Upload Artifact deb amd64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-deb-amd64
          path: build/*_amd64.deb
          if-no-files-found: error

      - name: Build Package deb arm64
        run: npm run pack:linux:deb:arm64
      - name: Upload Artifact deb arm64
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-deb-arm64
          path: build/*_arm64.deb
          if-no-files-found: error

      - name: Build Package deb armv7l
        run: npm run pack:linux:deb:armv7l
      - name: Upload Artifact deb armv7l
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-deb-armv7l
          path: build/*_armv7l.deb
          if-no-files-found: error

      - name: Build Package x64 appImage
        run: npm run pack:linux:appImage
      - name: Upload Artifact x64 appImage
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-x64-appImage
          path: build/*_x64.AppImage
          if-no-files-found: error

      - name: Build Package x64 rpm
        run: npm run pack:linux:rpm
      - name: Upload Artifact x64 rpm
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-x64-rpm
          path: build/*.x64.rpm
          if-no-files-found: error

      - name: Build Package x64 pacman
        run: npm run pack:linux:pacman
      - name: Upload Artifact x64 pacman
        uses: actions/upload-artifact@v7
        with:
          name: lx-music-desktop-x64-pacman
          path: build/*_x64.pacman
          if-no-files-found: error

      - name: Generate file MD5
        run: |
          cd build
          md5sum -- ./*.deb ./*.rpm ./*.pacman ./*.AppImage

  Create_Release:
    name: Create Prerelease
    runs-on: ubuntu-latest
    needs: [Windows, Windows_7, Mac, Linux, Vst3Audio]
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Read package version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate macOS update metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          arm64_dmg=$(find release-assets -name "*-$VERSION-arm64.dmg" -print -quit)
          x64_dmg=$(find release-assets -name "*-$VERSION-x64.dmg" -print -quit)
          test -n "$arm64_dmg" && test -n "$x64_dmg"
          arm64_name=$(basename "$arm64_dmg")
          x64_name=$(basename "$x64_dmg")
          arm64_sha=$(openssl dgst -sha512 -binary "$arm64_dmg" | base64 -w0)
          x64_sha=$(openssl dgst -sha512 -binary "$x64_dmg" | base64 -w0)
          arm64_size=$(stat -c %s "$arm64_dmg")
          x64_size=$(stat -c %s "$x64_dmg")
          release_date=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' \
            "$VERSION" "$arm64_name" "$arm64_sha" "$arm64_size" \
            "$x64_name" "$x64_sha" "$x64_size" \
            "$arm64_name" "$arm64_sha" "$release_date" \
            > release-assets/latest-mac.yml
      - name: Verify release asset set
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            "lx-music-desktop-v${VERSION}-x64-Setup.exe" \
            "lx-music-desktop-v${VERSION}-arm64-Setup.exe" \
            "lx-music-desktop-v${VERSION}-win_x64-green.7z" \
            "lx-music-desktop-v${VERSION}-win_arm64-green.7z" \
            "lx-music-desktop-v${VERSION}-win7_x64-Setup.exe" \
            "lx-music-desktop-v${VERSION}-win7_x64-green.7z" \
            "lx-music-desktop-v${VERSION}-win7_x86-green.7z" \
            "lx-music-desktop-${VERSION}-x64.dmg" \
            "lx-music-desktop-${VERSION}-arm64.dmg" \
            "lx-music-desktop_${VERSION}_amd64.deb" \
            "lx-music-desktop_${VERSION}_arm64.deb" \
            "lx-music-desktop_${VERSION}_armv7l.deb" \
            "lx-music-desktop_${VERSION}_x64.AppImage" \
            "lx-music-desktop-${VERSION}.x64.rpm" \
            "lx-music-desktop_${VERSION}_x64.pacman"; do
            test -n "$(find release-assets -type f -name "$pattern" -print -quit)"
          done
          test -s release-assets/latest-mac.yml

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="v$VERSION"
          title="LX Music 增强版 $VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --prerelease --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" --target "${{ github.sha }}" --title "$title" --prerelease --notes-file RELEASE_NOTES.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: find release-assets -type f -print0 | xargs -0 gh release upload "v$VERSION" --clobber
