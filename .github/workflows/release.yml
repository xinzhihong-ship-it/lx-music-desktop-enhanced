  Create_Release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [Windows, Windows_7, Mac, Linux]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Read package version
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release once
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        with:
          script: |
            const fs = require('fs')
            const tag = `v${process.env.VERSION}`
            const name = `LX Music 增强版 ${process.env.VERSION}`
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8')
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                body,
                prerelease: /beta|alpha|rc/i.test(process.env.VERSION),
              })
              core.info(`已更新版本 ${tag} 的中文发布说明`)
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                draft: false,
                // 版本号含 beta/alpha/rc 时标记为测试版
                prerelease: /beta|alpha|rc/i.test(process.env.VERSION),
              })
              core.info(`已创建版本 ${tag}`)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: find release-assets -type f -print0 | xargs -0 gh release upload "v$VERSION" --clobber
            }

  Windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        shell: pwsh
        run: |
          .\build-config\download-ffmpeg-windows.ps1 x64
          .\build-config\download-ffmpeg-windows.ps1 arm64

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build package
        run: |
          npm run pack:win:7z:x64
          npm run pack:win:7z:arm64
          npm run pack:win:setup:arm64
          npm run pack:win:setup:x64

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            build/*.exe
            build/*.7z

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List


  Windows_7:
    name: Windows_7
    runs-on: windows-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        shell: pwsh
        run: |
          .\build-config\download-ffmpeg-windows.ps1 x64
          .\build-config\download-ffmpeg-windows.ps1 x86

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22
          pip.exe install setuptools

      - name: Build win7 package
        run: |
          npm run pack:win7:setup:x64
          npm run pack:win7:7z:x64
          npm run pack:win7:7z:x86

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows7-release
          path: |
            build/*.exe
            build/*.7z

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

  Mac_Intel_FFmpeg:
    name: Mac Intel FFmpeg
    runs-on: macos-13
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Build LGPL FFmpeg
        run: |
          brew install lame
          bash build-config/build-ffmpeg-macos.sh x64

      - name: Upload Intel FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-ffmpeg
          path: resources/ffmpeg/darwin-x64

  Mac:
    name: Mac
    runs-on: macos-14
    needs: Mac_Intel_FFmpeg
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Build Apple Silicon FFmpeg
        run: |
          brew install lame
          bash build-config/build-ffmpeg-macos.sh arm64

      - name: Download Intel FFmpeg
        uses: actions/download-artifact@v8
        with:
          name: macos-x64-ffmpeg
          path: resources/ffmpeg/darwin-x64

      - name: Install python3 setuptools
        run: brew install python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"
      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build package
        run: |
          npm run pack:mac:dmg
          npm run pack:mac:dmg:arm64

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: mac-release
          path: build/*.dmg

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg

  Linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools gcc-arm-linux-gnueabihf qemu-user-static

      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"
      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Download verified FFmpeg
        run: |
          bash build-config/download-ffmpeg-linux.sh x64
          bash build-config/download-ffmpeg-linux.sh arm64
          bash build-config/build-ffmpeg-linux-armv7.sh

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build package
        run: |
          npm run pack:linux:deb:amd64
          npm run pack:linux:deb:arm64
          npm run pack:linux:deb:armv7l
          npm run pack:linux:appImage
          npm run pack:linux:rpm
          npm run pack:linux:pacman

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            build/*.deb
            build/*.rpm
            build/*.pacman
            build/*.AppImage

      - name: Generate file MD5
        run: |
          cd build
          md5sum *.deb *.rpm *.pacman *.AppImage
